<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>亲语 · 让父母每天都感受到你的爱</title>
<script src="/lib/live2d-cubism2.min.js"></script>
<script src="/lib/pixi.min.js"></script>
<script src="/lib/live2dcubismcore.min.js"></script>
<script src="/lib/pixi-live2d-full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: #FAF7F2;
  color: #3D2B1F;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ── 页面切换 ── */
.page { display: none; min-height: 100vh; flex-direction: column; }
.page.active { display: flex; }

/* ══════════════════════
   角色选择页
══════════════════════ */
#role-page {
  background: linear-gradient(160deg, #FAF7F2 0%, #FDF0E8 100%);
  padding-bottom: 48px;
}

.role-header {
  text-align: center;
  padding: 52px 24px 24px;
}
.logo {
  font-size: 32px; font-weight: 900;
  color: #C0392B; letter-spacing: 4px;
  margin-bottom: 8px;
}
.logo-sub {
  font-size: 14px; color: #B08070; letter-spacing: 1px;
}
.role-tagline {
  margin: 20px 24px;
  text-align: center;
  font-size: 20px; color: #5A3828; line-height: 1.7;
  background: #FFF9F5;
  border: 1.5px solid #F5CBA7;
  border-radius: 16px;
  padding: 16px 20px;
}

.role-label {
  text-align: center;
  font-size: 17px; color: #8B6B5E;
  margin: 24px 0 16px;
}

.role-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding: 0 20px;
}

.role-card {
  background: #fff;
  border: 2px solid #F0DDD0;
  border-radius: 22px;
  padding: 24px 14px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.22s ease;
  box-shadow: 0 2px 10px rgba(192,57,43,0.05);
  -webkit-tap-highlight-color: transparent;
}
.role-card:active { transform: scale(0.97); }
.role-card.selected {
  border-color: #E67E22;
  background: linear-gradient(145deg, #FFF8F3, #FFFAF7);
  box-shadow: 0 6px 24px rgba(230,126,34,0.18);
  transform: translateY(-3px);
}
.role-avatar { margin-bottom: 8px; display: flex; justify-content: center; }
.role-avatar svg { border-radius: 50%; }
.role-card .name { font-size: 20px; font-weight: 800; color: #3D2B1F; margin-bottom: 6px; }
.role-card .tag {
  display: inline-block;
  font-size: 12px; font-weight: 700;
  background: #FDE8D8; color: #C0392B;
  padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
}
.role-card.selected .tag { background: #FFF0E0; color: #E67E22; }
.role-card .desc { font-size: 14px; color: #9B7B6E; line-height: 1.6; }

.start-btn {
  display: block;
  margin: 28px 20px 0;
  width: calc(100% - 40px);
  background: linear-gradient(135deg, #F0884A, #C0392B);
  color: #fff;
  font-size: 22px; font-weight: 800;
  border: none; border-radius: 50px;
  padding: 18px;
  cursor: pointer;
  box-shadow: 0 5px 22px rgba(192,57,43,0.3);
  letter-spacing: 1px;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.start-btn:active { transform: scale(0.98); }
.start-btn:disabled {
  background: #D4BEB8;
  box-shadow: none;
  cursor: not-allowed;
}

/* ══════════════════════
   聊天页
══════════════════════ */
#chat-page { background: #FAF7F2; }

.chat-top {
  background: linear-gradient(135deg, #E8824A, #C0392B);
  padding: 14px 16px 12px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(192,57,43,0.2);
}
.back-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,0.22);
  border: none; color: #fff; font-size: 18px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0;
}
.chat-info { flex: 1; }
.chat-name { font-size: 20px; font-weight: 800; color: #fff; }
.chat-status { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 2px; }
.chat-emo {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}

/* ══ Live2D 虚拟形象区 ══ */
.avatar-stage {
  background: linear-gradient(180deg, #FFF5EE 0%, #FAF7F2 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  border-bottom: 1px solid #F0DDD0;
  position: relative;
  height: 320px;
  overflow: hidden;
}
#live2d-canvas {
  width: 100%; height: 100%;
  display: block;
  position: absolute; top: 0; left: 0;
}
/* 状态气泡 */
.avatar-bubble {
  position: absolute;
  top: 10px; right: 14px;
  background: #fff;
  border: 1.5px solid #F5CBA7;
  border-radius: 14px 14px 14px 4px;
  padding: 6px 12px;
  font-size: 13px; color: #C0392B; font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
  z-index: 10;
}
.avatar-bubble.show { opacity: 1; }
/* 加载占位 */
.avatar-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #B08070;
  background: linear-gradient(180deg, #FFF5EE, #FAF7F2);
}
@keyframes l2d-spin {
  to { transform: rotate(360deg); }
}
.avatar-loading-dot {
  width: 24px; height: 24px; border-radius: 50%;
  border: 3px solid #F5CBA7;
  border-top-color: #E67E22;
  animation: l2d-spin 0.8s linear infinite;
  margin-right: 10px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 14px 12px;
  display: flex; flex-direction: column; gap: 14px;
  -webkit-overflow-scrolling: touch;
}

.msg-time {
  font-size: 12px; color: #C4A899;
  text-align: center; padding: 4px 0;
}

.msg-row { display: flex; align-items: flex-end; gap: 9px; }
.msg-row.me { flex-direction: row-reverse; }

.msg-ava {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  background: #F5CBA7;
}
.msg-row.me .msg-ava { background: #FDDCBD; }

.bubble {
  max-width: 74%;
  padding: 13px 17px;
  border-radius: 20px;
  font-size: 19px; line-height: 1.65;
}
.msg-row:not(.me) .bubble {
  background: #fff;
  color: #3D2B1F;
  border-bottom-left-radius: 5px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.msg-row.me .bubble {
  background: linear-gradient(135deg, #F0884A, #D44B2A);
  color: #fff;
  border-bottom-right-radius: 5px;
}

/* 打字中动画 */
.typing-bubble {
  background: #fff;
  border-radius: 20px;
  border-bottom-left-radius: 5px;
  padding: 14px 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  display: flex; gap: 5px; align-items: center;
}
.typing-bubble span {
  width: 8px; height: 8px; border-radius: 50%;
  background: #D4B8B0;
  animation: bounce 1.2s infinite;
  display: inline-block;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* 危机提示 */
.crisis-tip {
  background: #FFF3CD;
  border: 1px solid #F5C518;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px; color: #856404;
  line-height: 1.6;
  margin: 0 4px;
}

.input-area {
  background: #fff;
  border-top: 1px solid #F0DDD0;
  padding: 12px 14px 28px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.msg-input {
  flex: 1;
  background: #FAF7F2;
  border: 1.5px solid #F0DDD0;
  border-radius: 50px;
  padding: 13px 18px;
  font-size: 19px; color: #3D2B1F;
  outline: none; font-family: inherit;
  transition: border-color 0.2s;
}
.msg-input:focus { border-color: #E67E22; }
.msg-input::placeholder { color: #C4A899; }
.send-btn {
  width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, #F0884A, #C0392B);
  border: none; color: #fff; font-size: 20px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  box-shadow: 0 3px 12px rgba(192,57,43,0.28);
  flex-shrink: 0; transition: all 0.2s;
}
.send-btn:active { transform: scale(0.93); }
.send-btn:disabled { background: #D4BEB8; box-shadow: none; cursor: not-allowed; }

/* 语音按钮 */
.mic-btn {
  width: 50px; height: 50px; border-radius: 50%;
  background: #FFF0E6;
  border: 2px solid #F0DDD0;
  color: #C0392B; font-size: 22px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s;
}
.mic-btn:active { transform: scale(0.93); }
.mic-btn.recording {
  background: #C0392B;
  border-color: #C0392B;
  color: #fff;
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
}

/* 朗读开关 */
.tts-toggle {
  position: absolute; right: 14px; top: 14px;
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: rgba(255,255,255,0.85);
  cursor: pointer; user-select: none;
}
.tts-toggle input { display: none; }
.tts-dot {
  width: 32px; height: 18px; border-radius: 9px;
  background: rgba(255,255,255,0.3);
  position: relative; transition: background 0.2s;
}
.tts-dot::after {
  content: ''; position: absolute;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px;
  transition: left 0.2s;
}
.tts-on .tts-dot { background: rgba(255,255,255,0.6); }
.tts-on .tts-dot::after { left: 16px; }

/* 不支持提示 */
.no-speech {
  font-size: 12px; color: #C4A899;
  text-align: center; padding: 6px 0 0;
}
</style>
</head>

<script>
// ══════════════════════════════════
// Live2D 虚拟形象控制
// ══════════════════════════════════

// 4种性格对应的模型（jsDelivr CDN，全部200可用）
// 4种性格对应不同模型，性别/声音全部匹配
const L2D_MODELS = {
  warmth:     '/models/Haru/Haru.model3.json',     // 暖心宝贝 → Haru   女生 → 晓晓女声
  funny:      '/models/Mao/Mao.model3.json',        // 开心果   → Mao    女生 → 晓伊女声
  steady:     '/models/Mark/Mark.model3.json',      // 靠谱大孩 → Mark   男生 → 云健男声
  chatterbox: '/models/Hiyori/Hiyori.model3.json',  // 小话痨   → Hiyori 女生 → 晓萱女声
};

let l2dApp = null;
let l2dModel = null;
let l2dTalkTimer = null;

async function initLive2D(personaKey) {
  const canvas = document.getElementById('live2d-canvas');
  const stageEl = document.getElementById('avatarStage');
  const W = stageEl.clientWidth || 360;
  const H = 320;
  canvas.width  = W;
  canvas.height = H;

  if (l2dApp) { l2dApp.destroy(true); l2dApp = null; l2dModel = null; }

  l2dApp = new PIXI.Application({
    view: canvas,
    width: W, height: H,
    transparent: true,
    antialias: true,
    backgroundAlpha: 0,
  });

  const modelUrl = L2D_MODELS[personaKey] || L2D_MODELS.warmth;
  try {
    l2dModel = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: false });

    // 根据模型原始尺寸自动计算缩放，让人物填满舞台高度的 95%
    const modelW = l2dModel.width  || l2dModel.internalModel?.originalWidth  || 2048;
    const modelH = l2dModel.height || l2dModel.internalModel?.originalHeight || 2048;
    const scaleByH = (H * 0.95) / modelH;
    const scaleByW = (W * 0.9)  / modelW;
    const scale = Math.min(scaleByH, scaleByW);

    l2dModel.scale.set(scale);
    l2dModel.anchor.set(0.5, 0);
    // 水平居中，顶部留一点空间
    l2dModel.position.set(W / 2, H * 0.02);
    l2dApp.stage.addChild(l2dModel);

    const loading = document.getElementById('avatarLoading');
    if (loading) loading.style.display = 'none';

    startIdleMotion();
  } catch(e) {
    console.warn('Live2D 加载失败', e);
    const loading = document.getElementById('avatarLoading');
    if (loading) loading.innerHTML = '😊';
  }
}

function startIdleMotion() {
  if (!l2dModel) return;
  try { l2dModel.motion('idle'); } catch(e) {}
}

// 说话：让模型嘴巴动（拨动 MouthOpenY 参数）
function setAvatarTalking(on) {
  showBubble(on ? '说话中…' : null);
  if (!l2dModel) return;
  clearInterval(l2dTalkTimer);
  if (on) {
    let v = 0, dir = 1;
    l2dTalkTimer = setInterval(() => {
      v += dir * 0.15;
      if (v >= 1) dir = -1;
      if (v <= 0) dir = 1;
      try {
        l2dModel.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', v);
      } catch(e) { clearInterval(l2dTalkTimer); }
    }, 60);
    try { l2dModel.motion('talk'); } catch(e) {}
  } else {
    try {
      l2dModel.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', 0);
      startIdleMotion();
    } catch(e) {}
  }
}

// 思考：让模型轻微点头
function setAvatarThinking(on) {
  showBubble(on ? '想一想…' : null);
  if (!l2dModel) return;
  try {
    if (on) { l2dModel.motion('flick_head'); }
    else { startIdleMotion(); }
  } catch(e) {}
}

function showBubble(text) {
  const b = document.getElementById('avatarBubble');
  if (!b) return;
  if (text) { b.textContent = text; b.classList.add('show'); }
  else { b.classList.remove('show'); }
}
function hideBubble() { showBubble(null); }

// ── 语音识别（STT） ──
let recognition = null;
let isRecording = false;

function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('noSpeechTip').style.display = 'block';
    document.getElementById('micBtn').style.display = 'none';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results)
      .map(r => r[0].transcript).join('');
    document.getElementById('msgInput').value = transcript;
    // 最终结果自动发送
    if (e.results[e.results.length - 1].isFinal) {
      stopMic();
      setTimeout(() => send(), 300);
    }
  };

  recognition.onerror = () => stopMic();
  recognition.onend = () => stopMic();
}

function toggleMic() {
  if (!recognition) {
    document.getElementById('noSpeechTip').style.display = 'block';
    return;
  }
  isRecording ? stopMic() : startMic();
}

function startMic() {
  isRecording = true;
  document.getElementById('micBtn').classList.add('recording');
  document.getElementById('micBtn').title = '说完自动发送';
  document.getElementById('msgInput').placeholder = '正在听…';
  recognition.start();
}

function stopMic() {
  isRecording = false;
  const btn = document.getElementById('micBtn');
  btn.classList.remove('recording');
  btn.title = '按下说话';
  document.getElementById('msgInput').placeholder = '跟孩子说说话…';
  try { recognition.stop(); } catch(e) {}
}

// ── 语音朗读（TTS · Edge-TTS 后端） ──
let ttsEnabled = true;
let currentAudio = null;

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const toggle = document.getElementById('ttsToggle');
  const label = document.getElementById('ttsLabel');
  if (ttsEnabled) {
    toggle.classList.add('tts-on');
    label.textContent = '🔊 朗读';
  } else {
    toggle.classList.remove('tts-on');
    label.textContent = '🔇 静音';
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  }
}

async function speak(text) {
  if (!ttsEnabled) return;
  // 停掉上一句
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  try {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, persona })
    });
    if (!res.ok) return;
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.onplay  = () => setAvatarTalking(true);
    currentAudio.onended = () => { setAvatarTalking(false); URL.revokeObjectURL(url); currentAudio = null; };
    currentAudio.onerror = () => { setAvatarTalking(false); currentAudio = null; };
    currentAudio.play();
  } catch(e) {
    console.warn('TTS 失败', e);
  }
}

// ── 角色选择 ──
function pick(el, key, name, avatarKey) {
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  persona = key;
  personaName = name;
  personaAvatarKey = avatarKey;
  personaEmoji = { warmth:'🤗', funny:'😄', steady:'💪', chatterbox:'🗣️' }[key] || '😊';
  const btn = document.getElementById('startBtn');
  btn.disabled = false;
  btn.textContent = `就选「${name}」陪我聊 ➜`;
}

// ── 进入聊天 ──
function startChat() {
  document.getElementById('chatName').textContent = personaName;
  // 顶部头像换成对应 SVG
  const emoEl = document.getElementById('chatEmo');
  emoEl.innerHTML = AVATAR_SVGS[personaAvatarKey] || personaEmoji;
  emoEl.style.overflow = 'hidden';
  document.getElementById('role-page').classList.remove('active');
  document.getElementById('chat-page').classList.add('active');

  history = [];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';

  addTime();
  initSpeech();
  initLive2D(persona);

  document.getElementById('ttsToggle').classList.add('tts-on');

  setTimeout(() => {
    document.getElementById('msgInput').focus();
  }, 300);
}

// ── 返回 ──
function goBack() {
  document.getElementById('chat-page').classList.remove('active');
  document.getElementById('role-page').classList.add('active');
  history = [];
}

// ── 发送 ──
async function send() {
  if (sending) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  appendMsg('me', text);
  history.push({ role: 'user', content: text });

  // 锁定发送
  sending = true;
  setSendState(false);

  setAvatarThinking(true);
  const typingId = showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ persona, messages: history })
    });
    const data = await res.json();
    removeTyping(typingId);
    setAvatarThinking(false);

    if (data.reply) {
      const crisis = data.reply.includes('【请联系真实家人或专业人员】');
      const cleanReply = data.reply.replace('【请联系真实家人或专业人员】', '').trim();

      appendMsg('ai', cleanReply);
      history.push({ role: 'assistant', content: cleanReply });
      speak(cleanReply);

      if (crisis) {
        showCrisis();
      }

      // 历史超过20条就裁剪，省token（保留最近16条）
      if (history.length > 20) {
        history = history.slice(history.length - 16);
      }
    } else {
      appendMsg('ai', '（网络有点慢，再说一遍试试？）');
    }
  } catch (e) {
    removeTyping(typingId);
    setAvatarThinking(false);
    appendMsg('ai', '（信号不太好，稍后再试）');
  }

  sending = false;
  setSendState(true);
  document.getElementById('msgInput').focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

// ── DOM 工具 ──
function appendMsg(from, text) {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row' + (from === 'me' ? ' me' : '');
  const avaHtml = from === 'me'
    ? '👴'
    : (AVATAR_SVGS[personaAvatarKey] || personaEmoji);
  row.innerHTML = `
    <div class="msg-ava" style="overflow:hidden">${avaHtml}</div>
    <div class="bubble">${escHtml(text)}</div>`;
  msgs.appendChild(row);
  scrollBottom();
}

function addTime() {
  const msgs = document.getElementById('messages');
  const now = new Date();
  const t = document.createElement('div');
  t.className = 'msg-time';
  t.textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
  msgs.appendChild(t);
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  const id = 'typing-' + Date.now();
  row.id = id;
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-ava" style="overflow:hidden">${AVATAR_SVGS[personaAvatarKey] || personaEmoji}</div>
    <div class="typing-bubble">
      <span></span><span></span><span></span>
    </div>`;
  msgs.appendChild(row);
  scrollBottom();
  return id;
}

function removeTyping(id) {
  document.getElementById(id)?.remove();
}

function showCrisis() {
  const msgs = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'crisis-tip';
  el.innerHTML = '⚠️ 如果您感到特别难受，请联系您的孩子或拨打心理援助热线：<strong>400-161-9995</strong>';
  msgs.appendChild(el);
  scrollBottom();
}

function setSendState(enabled) {
  document.getElementById('sendBtn').disabled = !enabled;
  document.getElementById('msgInput').disabled = !enabled;
}

function scrollBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}
